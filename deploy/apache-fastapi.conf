# Apache HTTP Server VirtualHost Config for Red Hat Enterprise Linux (RHEL)
# Host Name: agentic-honeypot.internal.micron.com

<VirtualHost *:80>
    ServerName agentic-honeypot.internal.micron.com
    ServerAdmin admin@micron.com

    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        ProxyPass http://127.0.0.1:8000/
        ProxyPassReverse http://127.0.0.1:8000/
    </Location>

    ErrorLog /var/log/httpd/honeypot_error.log
    CustomLog /var/log/httpd/honeypot_access.log combined
</VirtualHost>
